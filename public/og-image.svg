<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0a0f1e"/>
  <rect width="1200" height="630" fill="url(#grad)" opacity="0.15"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Grid pattern -->
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Gradient blobs -->
  <circle cx="200" cy="180" r="280" fill="#818cf8" opacity="0.06"/>
  <circle cx="1000" cy="450" r="280" fill="#a78bfa" opacity="0.06"/>
  <!-- Name -->
  <text x="600" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="700" fill="#f1f5f9" text-anchor="middle" letter-spacing="-2">Prazwal Bhusal</text>
  <!-- Gradient underline accent -->
  <rect x="450" y="280" width="300" height="4" rx="2" fill="url(#grad)"/>
  <!-- Subtitle -->
  <text x="600" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="400" fill="#94a3b8" text-anchor="middle">IT Student &amp; Technology Enthusiast</text>
  <!-- Location -->
  <text x="600" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#64748b" text-anchor="middle">Kathmandu, Nepal · prazwalbhusal.com.np</text>
</svg>
